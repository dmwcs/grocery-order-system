# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: damwcs
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: grocery-order-system
# "service" is the name of this project. This will also be added to your AWS resource names.
service: grocery-order-system

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-2

  environment:
    PRODUCTS_TABLE: ${self:service}-products-${sls:stage}

  iam:
    role:
      statements:
        - Effect: 'Allow'
          Action:
            - 'dynamodb:PutItem'
            - 'dynamodb:GetItem'
            - 'dynamodb:Scan'
            - 'dynamodb:UpdateItem'
            - 'dynamodb:DeleteItem'
          Resource: arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-products-${sls:stage}

functions:
  # Product Management Functions
  createProduct:
    handler: src/handlers/products.createProduct
    events:
      - httpApi:
          path: /products
          method: post

  getProduct:
    handler: src/handlers/products.getProduct
    events:
      - httpApi:
          path: /products/{code}
          method: get

  listProducts:
    handler: src/handlers/products.listProducts
    events:
      - httpApi:
          path: /products
          method: get

  updateProduct:
    handler: src/handlers/products.updateProduct
    events:
      - httpApi:
          path: /products
          method: put

  deleteProduct:
    handler: src/handlers/products.deleteProduct
    events:
      - httpApi:
          path: /products/{code}
          method: delete




resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: code
            AttributeType: S
        BillingMode: PAY_PER_REQUEST
        KeySchema:
          - AttributeName: code
            KeyType: HASH
        TableName: ${self:service}-products-${sls:stage}
